Cord.Audio.PlaybackNote="Per-app capture needs Android 13 or newer, and apps are allowed to refuse it - many games and chat apps do, which comes through as silence. It also cannot separate a game's voice chat from its sound effects, because the game mixes them itself. 'Everything the phone plays' is the reliable choice."

# --- hearing the phone ---
Cord.Hearing.Header="HEARING THE GAME YOURSELF

The default audio source captures the phone's whole output mix (the only source that also carries teammate voice), and Android gives that mix to one owner at a time - so while it is captured, the phone's own speakers and headphone jack go silent. Pick one of the two options below."
Cord.AudioDup="Keep audio playing on the phone as well (Android 13+)"
Cord.AudioDup.Note="Audio now plays on the phone too, so you can hear the game through headphones plugged into the PHONE, with no added delay.

The catch: this switches to per-app capture, which apps are allowed to refuse. If a game opts out you get silence on the stream, and it still cannot separate a game's voice chat from its effects. If the stream goes quiet, turn this back off."
