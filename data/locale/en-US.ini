# --- PC mic -> phone ---
Cord.MicSend.Enable="Send PC microphone to the phone"
Cord.MicSend.WiringNote="This needs a cable. Android gives no way for software to act as your phone's microphone, so your PC audio has to reach the phone as a real headset mic:\n\n  PC output  ->  line-to-mic attenuator  ->  USB-C audio adapter with a mic input  ->  phone\n\nSee docs/mic-wiring.md for the parts. Pick a DEDICATED output below - not your speakers or headset. If you pick your headset you will simply hear your own voice and the phone will get nothing. Never enable OBS monitoring on that device either, or the phone will hear itself and teammates will get an echo."
Cord.MicSend.Capture="Microphone to send"
Cord.MicSend.Render="Output wired to the phone"
Cord.MicSend.PickOutput="-- choose the output wired to your phone --"
Cord.MicSend.IsDefaultOutput="  [this PC's own output - NOT the phone]"
Cord.MicSend.DefaultWarning="You picked this PC's own playback device, so you are just hearing your own microphone and the phone receives nothing.

This feature needs a physical cable: a line-to-mic attenuator into a USB-C audio adapter with a microphone input, plugged into the phone. That adapter then appears here as its own output device - pick that one. Until the cable exists, leave this off. See docs/mic-wiring.md."
